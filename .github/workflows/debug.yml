name: debug
on:
  push:
    paths: [".github/workflows/debug.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          mkdir out && cd out
          for w in 앤트로픽 클로드; do
            Q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$w")
            curl -sS -A "$UA" -o "pc_$w.html" "https://search.naver.com/search.naver?where=news&query=$Q&sort=1"
          done
          git init -q && git checkout -q -b debug-out && git add -A
          git -c user.name=bot -c user.email=bot@x commit -qm out
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" debug-out
